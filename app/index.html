<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Workload</title>
    <style>
      body { background: #2b2b2b; font-family: monospace; display: flex; gap: 40px; justify-content: center; align-items: flex-start; padding-top: 40px; }
      .calc, .tape { box-shadow: 0 12px 30px #000; }
      .calc { background: linear-gradient(#4a4a4a, #333); border-radius: 24px; padding: 24px; width: 360px; }
      .brand { color: #ccc; font-size: 14px; letter-spacing: 3px; display: flex; justify-content: space-between; align-items: center; }
      .solar { background: repeating-linear-gradient(90deg, #3a2a1a 0 14px, #1a1208 14px 16px); width: 120px; height: 28px; border-radius: 4px; }
      .lcd { background: #9fb08a; border: 6px solid #222; border-radius: 6px; margin: 16px 0; padding: 10px; text-align: right; font-size: 40px; min-height: 96px; color: #222; overflow-wrap: anywhere; }
      .lcd.false { background: #c98a7a; }
      .lcd small { display: block; min-height: 1.2em; font-size: 16px; opacity: 0.7; }
      .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
      button { font: bold 26px monospace; padding: 16px 0; border: none; border-radius: 10px; background: #ddd; box-shadow: 0 4px #888; cursor: pointer; }
      button:active { transform: translateY(3px); box-shadow: 0 1px #888; }
      button.op { background: #f0a030; }
      button.eq { background: #e05030; color: #fff; grid-column: span 4; }
      .context { display: flex; gap: 8px; margin-top: 16px; }
      input, select { font: 16px monospace; padding: 6px; }
      input { flex: 1; }
      .tape { background: #fffef5; width: 260px; min-height: 500px; padding: 12px 16px; font-size: 16px; }
      .tape div { border-bottom: 1px dashed #ccc; padding: 6px 0; }
      .tape .false { color: #c00; }
      .tape .variant { color: #888; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="calc">
      <div class="brand"><span>LLM CALCULATOR</span><span class="solar"></span></div>
      <div class="lcd" id="lcd"><small id="info"></small><span id="display">0</span></div>
      <div class="keys" id="keys"></div>
      <div class="context">
        <input id="user" placeholder="user (targetingKey)" />
        <select id="plan"><option>pro</option><option>trial</option></select>
      </div>
    </div>
    <div class="tape" id="tape"></div>
    <script>
      const byId = (id) => document.getElementById(id);
      function element(tag, properties, ...children) {
        const created = Object.assign(document.createElement(tag), properties);
        created.append(...children);
        return created;
      }

      let input = '';
      for (const key of '789/456*123-C0.+=') {
        const className = key === '=' ? 'eq' : '/*-+'.includes(key) ? 'op' : '';
        byId('keys').append(element('button', { className, onclick: () => press(key) }, key));
      }

      document.onkeydown = (event) => {
        if (event.target.id === 'user') return;
        if (event.key === 'Backspace') return show((input = input.slice(0, -1)));
        if (event.key === ' ') event.preventDefault();
        // any printable character, so attacks can be typed too
        const key = { Enter: '=', Escape: 'C' }[event.key] ?? event.key;
        if (key.length === 1) press(key);
      };

      function press(key) {
        if (key === 'C') return show((input = ''));
        if (key !== '=') return show((input += key));
        if (input) calculate(input);
      }

      function show(text, detail = '', correct = '') {
        byId('display').textContent = text || '0';
        byId('info').textContent = detail;
        byId('lcd').className = `lcd ${correct}`;
      }

      async function calculate(question) {
        input = '';
        show('...', question);
        const query = new URLSearchParams({ q: question, user: byId('user').value || 'anonymous', plan: byId('plan').value });
        const reply = await (await fetch(`/calculate?${query}`)).json();
        const result = reply.blocked ? 'BLOCKED' : String(reply.result ?? reply.answer);
        const correct = reply.blocked ? 'false' : String(reply.correct);
        const expected = reply.expected === undefined ? '' : ` (expected ${reply.expected})`;
        show(result, reply.blocked ? `guardrail: ${reply.reason}` : question + expected, correct);
        const variants = `${reply.model} / ${reply.prompt} / temp ${reply.temperature} / guardrail ${reply.guardrail}`;
        const entry = element('div', { className: correct, title: reply.answer ?? '' });
        entry.append(`${question} = `, element('b', {}, result), element('div', { className: 'variant' }, variants));
        byId('tape').prepend(entry);
      }
    </script>
  </body>
</html>
