        {
          "id": 6,
          "type": "timeseries",
          "title": "Accuracy by configuration",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "interval": "5s",
          "gridPos": {
            "x": 0,
            "y": 11,
            "w": 12,
            "h": 13
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "((sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\",correct=\"true\"}[30s])) or sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[30s])) * 0) / sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[30s]))) and on(plan, model, prompt, temperature, guardrail) (sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[30s])) > 0)",
              "legendFormat": "{{plan}}: {{model}} / {{prompt}} / temp {{temperature}} / guardrail {{guardrail}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "color": {
                "mode": "palette-classic-by-name"
              },
              "custom": {
                "lineWidth": 3,
                "fillOpacity": 0,
                "spanNulls": false,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
