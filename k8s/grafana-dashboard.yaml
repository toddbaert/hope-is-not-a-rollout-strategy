# provisioned into grafana by k8s/lgtm.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: calculator
        type: file
        options:
          path: /otel-lgtm/calculator
          foldersFromFilesStructure: false
  dashboard.json: |
    {
      "uid": "calculator",
      "title": "Workload",
      "refresh": "5s",
      "time": {
        "from": "now-1m",
        "to": "now"
      },
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "name": "plan",
            "label": "plan",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(calculator_answers_total, plan)",
              "refId": "plan"
            },
            "definition": "label_values(calculator_answers_total, plan)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "sort": 1,
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          },
          {
            "name": "model",
            "label": "model",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(calculator_answers_total, model)",
              "refId": "model"
            },
            "definition": "label_values(calculator_answers_total, model)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "sort": 1,
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          },
          {
            "name": "prompt",
            "label": "prompt",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(calculator_answers_total, prompt)",
              "refId": "prompt"
            },
            "definition": "label_values(calculator_answers_total, prompt)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "sort": 1,
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          },
          {
            "name": "temperature",
            "label": "temperature",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(calculator_answers_total, temperature)",
              "refId": "temperature"
            },
            "definition": "label_values(calculator_answers_total, temperature)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "sort": 1,
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          },
          {
            "name": "guardrail",
            "label": "guardrail",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(calculator_answers_total, guardrail)",
              "refId": "guardrail"
            },
            "definition": "label_values(calculator_answers_total, guardrail)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "sort": 1,
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Accuracy",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "((sum(rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\",correct=\"true\"}[1m])) or sum(rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m])) * 0) / sum(rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m]))) and on() (sum(rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m])) > 0)",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.5
                  },
                  {
                    "color": "green",
                    "value": 0.75
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "-"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "last"
              ]
            }
          }
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Consistency",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "((sum(rate(calculator_repeats_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\",consistent=\"true\"}[1m])) or sum(rate(calculator_repeats_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m])) * 0) / sum(rate(calculator_repeats_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m]))) and on() (sum(rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m])) > 0)",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.9
                  },
                  {
                    "color": "green",
                    "value": 0.95
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "-"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "last"
              ]
            }
          }
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Hijacked",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(sum(rate(calculator_injections_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\",result=\"hijacked\"}[1m])) or sum(rate(calculator_injections_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m])) * 0) / sum(rate(calculator_injections_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m]))",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.05
                  },
                  {
                    "color": "red",
                    "value": 0.2
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "-"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "last"
              ]
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Tokens / request",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "((sum(rate(gen_ai_client_token_usage_sum{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m]))) / sum(rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m]))) and on() (sum(rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m])) > 0)",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 40
                  },
                  {
                    "color": "red",
                    "value": 45
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "-"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "last"
              ]
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Latency p50",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(histogram_quantile(0.5, sum by (le) (rate(gen_ai_client_operation_duration_seconds_bucket{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m])))) and on() (sum(rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m])) > 0)",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "-"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "last"
              ]
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Requests / min",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 20,
            "y": 0,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(sum(rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m])) * 60) and on() (sum(rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m])) > 0)",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "-"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "last"
              ]
            }
          }
        },
        {
          "id": 5,
          "type": "table",
          "title": "Live configurations (last minute)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m])) / scalar(sum(rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m])))) and on(plan, model, prompt, temperature, guardrail) (sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m])) > 0)",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "((sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\",correct=\"true\"}[1m])) or sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m])) * 0) / sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m]))) and on(plan, model, prompt, temperature, guardrail) (sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m])) > 0)",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "((sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\",correct=\"true\",difficulty=\"hard\"}[1m])) or sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\",difficulty=\"hard\"}[1m])) * 0) / sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\",difficulty=\"hard\"}[1m]))) and on(plan, model, prompt, temperature, guardrail) (sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m])) > 0)",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "F",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "((sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_repeats_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\",consistent=\"true\"}[1m])) or sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_repeats_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m])) * 0) / sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_repeats_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m]))) and on(plan, model, prompt, temperature, guardrail) (sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m])) > 0)",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "G",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "((sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_injections_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\",result=\"hijacked\"}[1m])) or sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_injections_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m])) * 0) / sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_injections_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m]))) and on(plan, model, prompt, temperature, guardrail) (sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m])) > 0)",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "((sum by (plan, model, prompt, temperature, guardrail) (rate(gen_ai_client_token_usage_sum{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m]))) / sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m]))) and on(plan, model, prompt, temperature, guardrail) (sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m])) > 0)",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "E",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(histogram_quantile(0.5, sum by (le, plan, model, prompt, temperature, guardrail) (rate(gen_ai_client_operation_duration_seconds_bucket{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m])))) and on(plan, model, prompt, temperature, guardrail) (sum by (plan, model, prompt, temperature, guardrail) (rate(calculator_answers_total{plan=~\"$plan\",model=~\"$model\",prompt=~\"$prompt\",temperature=~\"$temperature\",guardrail=~\"$guardrail\"}[1m])) > 0)",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "plan": 0,
                  "model": 1,
                  "prompt": 2,
                  "temperature": 3,
                  "guardrail": 4,
                  "Value #A": 5,
                  "Value #B": 6,
                  "Value #C": 7,
                  "Value #F": 8,
                  "Value #G": 9,
                  "Value #D": 10,
                  "Value #E": 11
                },
                "renameByName": {
                  "temperature": "temp"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Value #A",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "center"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value #A"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "traffic"
                  },
                  {
