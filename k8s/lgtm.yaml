# all-in-one OTel Collector, Prometheus, Tempo, Loki, Grafana (demo use only)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
spec:
  selector:
    matchLabels:
      app: lgtm
  template:
    metadata:
      labels:
        app: lgtm
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.38.1
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /otel-lgtm/calculator/dashboard.json
          ports:
            - containerPort: 3000
            - containerPort: 4318
          volumeMounts:
            - name: dashboard
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/calculator.yaml
              subPath: provider.yaml
            # dashboard JSON; restart lgtm after edits (file reload is unreliable)
            - name: dashboard
              mountPath: /otel-lgtm/calculator
      volumes:
        - name: dashboard
          configMap:
            name: grafana-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
spec:
  type: NodePort
  selector:
    app: lgtm
  ports:
    - name: grafana
      port: 3000
      nodePort: 30300
    - name: otlp-http
      port: 4318
