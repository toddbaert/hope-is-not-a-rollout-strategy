kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kubecon
nodes:
  - role: control-plane
    image: kindest/node:v1.35.0
    extraPortMappings:
      - containerPort: 30080 # calculator
        hostPort: 8080
      - containerPort: 30300 # grafana
        hostPort: 3000
    extraMounts:
      # cache models on the host so recreating the cluster doesn't re-download them
      - hostPath: ./.models
        containerPath: /models
